name: aria

x-app: &app
  build:
    context: .
  env_file:
    - .env
  environment:
    ARIA_DATABASE_HOST: postgres
    ARIA_DATABASE_PORT: "5432"
    ARIA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ARIA_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  volumes:
    - .:/app
  restart: unless-stopped
  networks:
    - backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app
    command:
      - gunicorn
      - aria.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "${ARIA_BIND_ADDRESS:-127.0.0.1}:${ARIA_WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command:
      - celery
      - --app=aria
      - worker
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --concurrency=${ARIA_WORKER_CONCURRENCY:-2}
      - --queues=discovery,http_fetch,browser_fetch,extraction,ocr,normalization,diff,event_publish
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command:
      - celery
      - --app=aria
      - beat
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    driver: bridge
