name: aria

x-app: &app
  build:
    context: .
    target: app
  env_file:
    - .env
  environment:
    ARIA_DATABASE_HOST: postgres
    ARIA_DATABASE_PORT: "5432"
    ARIA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ARIA_CACHE_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    ARIA_CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    ARIA_METRICS_TOKEN: ${ARIA_METRICS_TOKEN:-}
    ARIA_HTTP_SUPPLEMENTAL_CA_BUNDLE: ${ARIA_HTTP_SUPPLEMENTAL_CA_BUNDLE:-/app/config/certificates/sectigo-public-server-authentication-ca-dv-r36.pem}
  volumes:
    - .:/app
    - artifact-data:/var/lib/aria/artifacts
    - reader-ui:/app/frontend/reader/dist:ro
  restart: unless-stopped
  networks:
    - backend

services:
  frontend-assets:
    build:
      context: .
      target: reader-ui
    command:
      - node
      - -e
      - const fs=require('node:fs'); for (const name of fs.readdirSync('/reader-ui')) fs.rmSync('/reader-ui/'+name,{recursive:true,force:true}); fs.cpSync('/reader/dist','/reader-ui',{recursive:true})
    volumes:
      - reader-ui:/reader-ui
    restart: "no"
    networks:
      - backend

  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - backend

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app
    command:
      - gunicorn
      - aria.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=4
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "${ARIA_BIND_ADDRESS:-127.0.0.1}:${ARIA_WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; host = os.environ.get('ARIA_ALLOWED_HOSTS', '127.0.0.1').split(',')[0].strip() or '127.0.0.1'; request = urllib.request.Request('http://127.0.0.1:8000/health/live/', headers={'Host': host}); urllib.request.urlopen(request, timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      frontend-assets:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  test:
    <<: *app
    profiles: ["tools"]
    build:
      context: .
      target: test
    command: ["python", "manage.py", "test"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command:
      - celery
      - --app=aria
      - worker
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --concurrency=${ARIA_WORKER_CONCURRENCY:-2}
      - --queues=discovery,http_fetch,extraction,normalization,diff,event_publish
    depends_on:
      migrate:
        condition: service_completed_successfully

  browser-worker:
    <<: *app
    user: aria
    build:
      context: .
      target: browser
    command:
      - celery
      - --app=aria
      - worker
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --concurrency=1
      - --queues=browser_fetch
      - --hostname=browser@%h
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=536870912,mode=1777
    shm_size: 1gb
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.5"
    cap_drop:
      - ALL
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./docker/playwright-seccomp.json
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts
      - reader-ui:/app/frontend/reader/dist:ro
    stop_grace_period: 1m
    depends_on:
      migrate:
        condition: service_completed_successfully

  ocr-worker:
    <<: *app
    build:
      context: .
      target: ocr
    command:
      - celery
      - --app=aria
      - worker
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --concurrency=1
      - --queues=ocr
      - --hostname=ocr@%h
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *app
    command:
      - celery
      - --app=aria
      - beat
      - --loglevel=${ARIA_LOG_LEVEL:-INFO}
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  backup:
    <<: *app
    profiles: ["operations"]
    build:
      context: .
      target: backup
    command: ["python", "manage.py", "create_backup"]
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts:ro
      - backup-data:/var/lib/aria/backups
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: ["observability"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$ARIA_METRICS_TOKEN" || { echo "ARIA_METRICS_TOKEN is required" >&2; exit 1; };
        umask 077;
        printf '%s' "$$ARIA_METRICS_TOKEN" > /tmp/aria-metrics-token;
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
    environment:
      ARIA_METRICS_TOKEN: ${ARIA_METRICS_TOKEN:-}
    ports:
      - "${ARIA_PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${ARIA_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/aria-alerts.yml:/etc/prometheus/aria-alerts.yml:ro
      - prometheus-data:/prometheus
    tmpfs:
      - /tmp:size=1048576,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    profiles: ["observability"]
    user: "472"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$GF_SECURITY_ADMIN_PASSWORD" ||
        { echo "ARIA_GRAFANA_ADMIN_PASSWORD is required" >&2; exit 1; };
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: ${ARIA_GRAFANA_ADMIN_USER:-aria-observer}
      GF_SECURITY_ADMIN_PASSWORD: ${ARIA_GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/aria-pipeline-performance.json
      GF_SERVER_DOMAIN: ${ARIA_GRAFANA_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: ${ARIA_GRAFANA_ROOT_URL:-http://localhost:3002}
      GF_SERVER_ENFORCE_DOMAIN: ${ARIA_GRAFANA_ENFORCE_DOMAIN:-false}
    ports:
      - "${ARIA_GRAFANA_BIND_ADDRESS:-127.0.0.1}:${ARIA_GRAFANA_PORT:-3002}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=67108864,mode=1777
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:
  artifact-data:
  reader-ui:
  backup-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
    driver: bridge
