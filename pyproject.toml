[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-core"
version = "0.1.0"
description = "Evidence-first infrastructure for autonomous regulatory intelligence."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.14,<4.15",
  "boto3>=1.40,<2",
  "celery[redis]>=5.6,<5.7",
  "Django>=5.2,<5.3",
  "defusedxml>=0.7,<0.8",
  "djangorestframework>=3.17,<3.18",
  "gunicorn>=23,<24",
  "httpx>=0.28,<0.29",
  "openai>=2,<3",
  "pgvector>=0.5,<0.6",
  "psycopg[binary]>=3.2,<3.4",
  "pydantic>=2.12,<3",
  "pypdf>=6.14,<7",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.8,<8",
  "ruff>=0.12,<0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.coverage.run]
source = ["aria"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
