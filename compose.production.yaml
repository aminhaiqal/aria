x-hardened-app: &hardened-app
  user: aria
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  frontend-assets:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  postgres:
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"

  redis:
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  migrate:
    <<: *hardened-app
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts:ro
      - reader-ui:/app/frontend/reader/dist:ro
    mem_limit: 512m
    cpus: "1.0"

  api:
    <<: *hardened-app
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts:ro
      - reader-ui:/app/frontend/reader/dist:ro
    mem_limit: 768m
    cpus: "1.5"

  worker:
    <<: *hardened-app
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts
      - reader-ui:/app/frontend/reader/dist:ro
    mem_limit: 1g
    cpus: "2.0"

  browser-worker:
    mem_limit: 1g
    cpus: "1.5"

  ocr-worker:
    <<: *hardened-app
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts
      - reader-ui:/app/frontend/reader/dist:ro
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 384

  beat:
    <<: *hardened-app
    volumes:
      - .:/app:ro
      - artifact-data:/var/lib/aria/artifacts:ro
      - reader-ui:/app/frontend/reader/dist:ro
    mem_limit: 256m
    cpus: "0.5"

  backup:
    <<: *hardened-app
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    mem_limit: 1g
    cpus: "1.5"

  prometheus:
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.5"
