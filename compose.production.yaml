x-production-environment: &production-environment
  ARIA_DEBUG: "false"
  ARIA_ENFORCE_OPERATOR_ROLES: "true"
  ARIA_REQUIRE_SEPARATE_PUBLISHER: "true"
  ARIA_TRUST_X_FORWARDED_PROTO: "true"
  ARIA_SSL_REDIRECT: "true"
  ARIA_SECURE_COOKIES: "true"
  ARIA_SECURE_HSTS_SECONDS: "3600"
  ARIA_OBJECT_STORAGE_BACKEND: "s3"
  ARIA_BACKUP_UPLOAD_TO_R2: "true"
  ARIA_RELEASE_REVISION: ${ARIA_RELEASE_REVISION:-unknown}

x-hardened-app: &hardened-app
  user: aria
  read_only: true
  environment: *production-environment
  tmpfs:
    - /tmp:size=268435456,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  frontend-assets:
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"

  postgres:
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"

  redis-init:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    user: root
    command: ["sh", "-c", "chown -R redis:redis /data"]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 32
    mem_limit: 64m
    cpus: "0.25"
    volumes:
      - redis-data:/data
    restart: "no"

  redis:
    user: redis
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    depends_on:
      redis-init:
        condition: service_completed_successfully

  migrate:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts:ro
    mem_limit: 512m
    cpus: "1.0"

  api:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts:ro
    mem_limit: 768m
    cpus: "1.5"

  worker:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts
    mem_limit: 1g
    cpus: "2.0"

  browser-worker:
    environment: *production-environment
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts
    mem_limit: 1g
    cpus: "1.5"

  ocr-worker:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 384

  beat:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts:ro
    mem_limit: 256m
    cpus: "0.5"

  backup:
    <<: *hardened-app
    volumes: !override
      - artifact-data:/var/lib/aria/artifacts:ro
      - backup-data:/var/lib/aria/backups
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    mem_limit: 1g
    cpus: "1.5"

  prometheus:
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.5"
