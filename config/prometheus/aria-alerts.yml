groups:
  - name: aria-operational
    rules:
      - alert: AriaMetricsUnavailable
        expr: up{job="aria"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ARIA metrics endpoint is unavailable
      - alert: AriaSchedulerWorkerHeartbeatMissing
        expr: aria_scheduler_worker_heartbeat_age_seconds > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ARIA scheduler-worker heartbeat is stale
      - alert: AriaOutboxDeliveryFailed
        expr: aria_impact_delivery_events{status="failed"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ARIA has failed reviewed-publication delivery events
      - alert: AriaReviewQueueStale
        expr: aria_review_oldest_age_seconds > 259200
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ARIA has review work waiting longer than three days
          description: >-
            The oldest {{ $labels.kind }} review item has waited more than 72 hours.
      - alert: AriaPublicationReadyStale
        expr: aria_publication_ready_oldest_age_seconds > 86400
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ARIA has reviewed work waiting for publication
          description: >-
            The oldest publishable {{ $labels.kind }} item has waited more than 24 hours.
      - alert: AriaOutboxDeliveryPending
        expr: >-
          (aria_impact_delivery_oldest_pending_age_seconds > 900)
          and on() (aria_impact_delivery_configured == 1)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ARIA delivery has remained pending for more than 15 minutes
      - alert: AriaSourceEndpointUnhealthy
        expr: aria_source_endpoints{health_state="unhealthy"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ARIA has an unhealthy official source endpoint
      - alert: AriaSourceReliabilityNeedsAttention
        expr: aria_source_reliability_info{status=~"warning|critical"} == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ARIA source reliability needs attention
          description: >-
            Source {{ $labels.source }} has remained in {{ $labels.status }} state for 15 minutes.
      - alert: AriaSourceFreshnessExpired
        expr: aria_source_freshness_headroom_seconds < 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: ARIA official-source evidence is stale
          description: >-
            Source {{ $labels.source }} is past its evidence freshness deadline.
      - alert: AriaSourcePollOverdue
        expr: aria_source_poll_overdue_seconds > 900
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ARIA source poll is overdue
          description: >-
            Source {{ $labels.source }} is more than 15 minutes past its scheduled poll.
      - alert: AriaSourceCoverageIncomplete
        expr: >-
          (aria_source_coverage_ratio < 1)
          and on (source, endpoint)
          (aria_source_reliability_info{status=~"warning|critical"} == 1)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: ARIA source evidence coverage is incomplete
          description: >-
            Source {{ $labels.source }} remains incomplete at the {{ $labels.stage }} stage.
      - alert: AriaSourceRunSuccessRateLow
        expr: >-
          (aria_source_run_success_ratio{window="24h"} < 0.95)
          and on() (sum(aria_source_runs_window{window="24h",status=~"completed|failed"}) > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: ARIA source-run success fell below 95 percent over 24 hours
      - alert: AriaPipelineWorkStalled
        expr: aria_pipeline_oldest_active_age_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: ARIA has active pipeline work older than 30 minutes
